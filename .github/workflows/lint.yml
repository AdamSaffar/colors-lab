name: Colors CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: colors_test
          MYSQL_USER: colors_ci
          MYSQL_PASSWORD: ci-password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mysqli
          coverage: none
          tools: none

      - name: Install dependencies
        run: npm ci

      - name: Lint HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Configure test database
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          cat > LAMPAPI/config.php <<'PHP'
          <?php
          return [
              "host" => "127.0.0.1:3307",
              "username" => "colors_ci",
              "password" => "ci-password",
              "database" => "colors_test"
          ];
          PHP

          docker exec -i "$MYSQL_CONTAINER_ID" \
            mysql --user=colors_ci --password=ci-password colors_test < tests/schema.sql

      - name: Start PHP test server
        run: |
          php -S 127.0.0.1:8000 -t . > "$RUNNER_TEMP/php-server.log" 2>&1 &

          for attempt in {1..20}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8000/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/php-server.log"
          exit 1

      - name: Run unit and integration tests
        run: npm test

      - name: Show PHP log on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/php-server.log" ]; then
            cat "$RUNNER_TEMP/php-server.log"
          fi